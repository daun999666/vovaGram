name: Build Tauri Windows app

on:
  push:
    branches: [v2.0.0-tauri]
    paths:
      - "desktop/tauri/**"
      - "server.js"
      - "public/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/build-tauri-windows.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Build Node backend sidecar
        shell: pwsh
        run: |
          npm install
          npm run build:win
          if (!(Test-Path "dist/vovchikGram.exe")) { throw "Backend sidecar build failed." }
          $triple = "x86_64-pc-windows-msvc"
          New-Item -ItemType Directory -Force "desktop/tauri/src-tauri/binaries" | Out-Null
          Copy-Item "dist/vovchikGram.exe" "desktop/tauri/src-tauri/binaries/vovchikgram-server-$triple.exe" -Force

      - name: Install Tauri CLI
        working-directory: desktop/tauri
        run: npm install

      - name: Build Tauri installer
        working-directory: desktop/tauri
        run: npm run tauri -- build

      - name: Upload Tauri installers
        uses: actions/upload-artifact@v4
        with:
          name: vovchikGram-Tauri-Windows-x64
          path: |
            desktop/tauri/src-tauri/target/release/bundle/nsis/*.exe
            desktop/tauri/src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error
